name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v6
      - name: Install, validate, build and upload
        uses: withastro/action@v6
        with:
          node-version: '24'
          # Astro's action runs npm install first. Reject lockfile drift, then
          # explicitly reinstall the committed dependency tree before validation.
          build-cmd: git diff --exit-code -- package-lock.json && npm ci && npm run check && npm test && npm run build
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
